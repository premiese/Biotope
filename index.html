<script id="gb-site-config" type="application/json">{
 "version": 1,
 "title": "도시생태현황지도 제작",
 "vars": {},
 "css": "",
 "js": "// 사이트 이름 고정: 브라우저 탭 제목 + 왼쪽 위 로고 글자\n(() => {\n  const NAME = '도시생태현황지도 제작';\n  if (window.__gbNameLock) return;          // 두 번 실행돼도 한 번만 동작\n  window.__gbNameLock = true;\n\n  const fix = () => {\n    if (document.title !== NAME) document.title = NAME;\n    const b = document.querySelector('.brand b');\n    if (b && b.textContent !== NAME) b.textContent = NAME;\n  };\n  fix();\n\n  // 제목이나 로고가 바뀌면 다시 고정\n  const head = document.querySelector('title') || document.head;\n  new MutationObserver(fix).observe(head, { childList: true, characterData: true, subtree: true });\n  const brand = document.querySelector('.brand');\n  if (brand) new MutationObserver(fix).observe(brand, { childList: true, characterData: true, subtree: true });\n})();",
 "texts": [
  {
   "p": "#app > header:nth-of-type(1) > div:nth-of-type(1) > div:nth-of-type(2) > small:nth-of-type(1)",
   "t": "정사영상 경계 추출"
  }
 ],
 "vworldKey": "B1C08559-6A06-4ACE-973E-54C4DD0C798E",
 "github": {
  "owner": "premiese",

 }
}</script>
<script>/* ===== GeoBound 공개 사이트 런타임 =====
   - 실행 위치 판별: 로컬 서버(localhost) / claude.ai / 공개 사이트(그 외 모든 주소)
   - 공개 사이트에서는 로컬 서버 API(/api/*, /proxy/cog)를 브라우저 안에서 대신 처리함
   - 사이트 설정(gb-site-config: 디자인 변수·CSS·텍스트·사용자 스크립트)을 화면에 적용함 */
(function () {
  'use strict';
  var host = location.hostname;
  var IS_LOCAL = /^https?:$/.test(location.protocol) && /^(localhost|127\.0\.0\.1|\[::1\])$/.test(host);
  var IS_CLAUDE = /(^|\.)claude\.ai$|claudeusercontent\.com$|(^|\.)anthropic\.com$/.test(host) || !!(window.claude && window.claude.use);
  var WEB = !IS_LOCAL && !IS_CLAUDE;
  var PREVIEW = window.name === 'gb-preview';

  var LS = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v == null ? (d || '') : v; } catch (e) { return d || ''; } },
    set: function (k, v) { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) { } }
  };

  var published = {};
  try { published = JSON.parse(document.getElementById('gb-site-config').textContent) || {}; } catch (e) { }
  var draft = null;
  try { draft = JSON.parse(LS.get('gb-site-draft') || 'null'); } catch (e) { }
  var usingDraft = !PREVIEW && !!draft && LS.get('gb-site-draft-on') === '1';
  var SITE = usingDraft ? draft : published;

  var GB = window.GB = {
    WEB: WEB, IS_LOCAL: IS_LOCAL, IS_CLAUDE: IS_CLAUDE, PREVIEW: PREVIEW,
    SITE: SITE, PUBLISHED: published, usingDraft: usingDraft, LS: LS,
    vwCors: true,
    vworldKey: function () { return LS.get('gb-vworld-key') || (GB.SITE && GB.SITE.vworldKey) || ''; },
    aiKey: function () { return LS.get('gb-anthropic-key'); },
    aiModel: function () { return LS.get('gb-anthropic-model') || 'claude-sonnet-5-5'; },
    _orig: new Map(), _varsSet: []
  };

  // ---------- 사이트 설정 적용 ----------
  GB.applyVars = function (c) {
    var st = document.documentElement.style;
    GB._varsSet.forEach(function (k) { st.removeProperty(k); });
    GB._varsSet = [];
    var v = (c && c.vars) || {};
    Object.keys(v).forEach(function (k) { if (/^--[\w-]+$/.test(k) && v[k] !== '') { st.setProperty(k, v[k]); GB._varsSet.push(k); } });
  };
  GB.applyCss = function (c) {
    var el = document.getElementById('gb-user-css');
    if (!el) { el = document.createElement('style'); el.id = 'gb-user-css'; (document.head || document.documentElement).appendChild(el); }
    el.textContent = (c && c.css) || '';
  };
  GB.applyTitle = function (c) { if (c && c.title) document.title = c.title; };

  function textNodes(el) { return Array.prototype.filter.call(el.childNodes, function (n) { return n.nodeType === 3 && n.textContent.trim(); }); }
  GB.directText = function (el) { return Array.prototype.filter.call(el.childNodes, function (n) { return n.nodeType === 3; }).map(function (n) { return n.textContent; }).join('').trim(); };
  GB.setDirectText = function (el, t) {
    var nodes = textNodes(el);
    if (nodes.length) {
      var m = nodes[0].textContent.match(/^(\s*)[\s\S]*?(\s*)$/);
      nodes[0].textContent = m[1] + t + m[2];
      for (var i = 1; i < nodes.length; i++) nodes[i].textContent = '';
    } else if (!el.children.length) el.textContent = t;
    else if (t) el.appendChild(document.createTextNode(t));
  };
  GB.rememberOrig = function (p, el) {
    if (!GB._orig.has(p)) GB._orig.set(p, { text: GB.directText(el), title: el.getAttribute('title'), display: el.style.getPropertyValue('display'), pri: el.style.getPropertyPriority('display') });
  };
  GB.revertText = function (p) {
    var o = GB._orig.get(p), el = GB.q(p); if (!o || !el) return;
    GB.setDirectText(el, o.text);
    if (o.title == null) el.removeAttribute('title'); else el.setAttribute('title', o.title);
    el.style.setProperty('display', o.display || '', o.pri || '');
  };
  GB.q = function (p) { try { return document.querySelector(p); } catch (e) { return null; } };
  GB.applyTextOne = function (o) {
    var el = GB.q(o.p); if (!el) return false;
    GB.rememberOrig(o.p, el);
    if (o.t != null) GB.setDirectText(el, o.t);
    if (o.title != null) { if (o.title) el.setAttribute('title', o.title); else el.removeAttribute('title'); }
    if (o.hide) el.style.setProperty('display', 'none', 'important');
    else { var orig = GB._orig.get(o.p); el.style.setProperty('display', orig.display || '', orig.pri || ''); }
    return true;
  };
  GB.applyTexts = function (c) {
    var miss = 0;
    ((c && c.texts) || []).forEach(function (o) { if (!GB.applyTextOne(o)) miss++; });
    return miss;
  };
  GB.runJs = function (c, manual) {
    var code = (c && c.js) || ''; if (!code.trim()) return true;
    try { new Function(code)(); return true; }
    catch (e) {
      console.error('[GeoBound 사용자 스크립트]', e);
      if (typeof toast === 'function') toast('사용자 스크립트 오류: ' + (e && e.message || e), 'err');
      if (manual) throw e;
      return false;
    }
  };

  GB.applyVars(SITE); GB.applyCss(SITE); GB.applyTitle(SITE);
  window.addEventListener('load', function () {
    setTimeout(function () { GB.applyTitle(GB.SITE); GB.applyTexts(GB.SITE); GB.runJs(GB.SITE); }, 300);
    setTimeout(function () { GB.applyTexts(GB.SITE); }, 2000);
  });

  if (!WEB) return;

  // ---------- 공개 사이트: 로컬 서버 API를 브라우저에서 대신 처리 ----------
  var STAC_URL = 'https://earth-search.aws.element84.com/v1/search';
  var realFetch = window.fetch.bind(window);
  GB.realFetch = realFetch;
  function J(obj, status) { return new Response(JSON.stringify(obj), { status: status || 200, headers: { 'Content-Type': 'application/json' } }); }
  function method(init) { return ((init && init.method) || 'GET').toUpperCase(); }

  window.fetch = function (input, init) {
    if (typeof input !== 'string' || !(input.indexOf('/api/') === 0 || input.indexOf('/proxy/cog') === 0)) return realFetch(input, init);
    var u = new URL(input, 'https://geobound.invalid'), p = u.pathname;
    init = init || {};
    if (p === '/api/health') return Promise.resolve(J({ ok: true, web: true, qgis: false, vworld: !!GB.vworldKey(), ai: !!GB.aiKey(), s2: true }));
    if (p === '/api/config') {
      if (method(init) === 'POST') {
        var b = {}; try { b = JSON.parse(init.body || '{}'); } catch (e) { }
        if (b.vworld_key !== undefined) LS.set('gb-vworld-key', b.vworld_key);
        if (b.anthropic_api_key !== undefined) LS.set('gb-anthropic-key', b.anthropic_api_key);
        if (b.anthropic_model !== undefined) LS.set('gb-anthropic-model', b.anthropic_model);
        return Promise.resolve(J({ ok: true }));
      }
      return Promise.resolve(J({ vworld_key_set: !!LS.get('gb-vworld-key'), site_vworld: !!(GB.SITE && GB.SITE.vworldKey), anthropic_key_set: !!GB.aiKey(), anthropic_model: GB.aiModel(), web: true }));
    }
    if (p === '/api/s2/search') return realFetch(STAC_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: init.body, signal: init.signal });
    if (p === '/api/claude') {
      var key = GB.aiKey();
      if (!key) return Promise.resolve(J({ error: 'Anthropic API 키가 없음 — 상단 “공개 사이트” 칩을 눌러 입력' }, 400));
      var body = {}; try { body = JSON.parse(init.body || '{}'); } catch (e) { }
      var payload = { model: GB.aiModel(), max_tokens: Math.min(+body.max_tokens || 4096, 16000), messages: body.messages };
      if (body.tools) payload.tools = body.tools;
      return realFetch('https://api.anthropic.com/v1/messages', {
        method: 'POST', signal: init.signal, body: JSON.stringify(payload),
        headers: { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' }
      }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) {
          if (!r.ok) return J({ error: 'Anthropic API ' + r.status + ': ' + ((j.error && j.error.message) || '') }, r.status);
          return J(j);
        });
      });
    }
    if (p === '/api/qgis/run') return Promise.resolve(J({ error: '공개 사이트에서는 qgis_process를 실행할 수 없음 — 엔진을 “브라우저”로 두거나 로컬 서버 패키지를 사용할 것' }, 400));
    if (p === '/proxy/cog') return realFetch(u.searchParams.get('url'), { headers: init.headers, signal: init.signal });
    return Promise.resolve(J({ error: 'not found' }, 404));
  };
})();
</script>
</head>
<body>
<style>
:root{--bg:#f4f7f5;--bg2:#eef3f0;--panel:#ffffff;--panel2:#f3f7f5;--line:#e2e8e4;--line2:#cdd8d2;--text:#1d2b25;--muted:#5d6d65;--dim:#95a39c;--acc:#1f8a5b;--acc-d:#166b46;--acc-ink:#ffffff;--navy:#24365f;--amber:#d98a1c;--red:#d64545;--blue:#2f6fd6;--r:10px;--sans:'Pretendard','IBM Plex Sans KR','Malgun Gothic',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.5 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
#app{display:grid;grid-template-rows:62px 50px 1fr 26px;grid-template-columns:86px 300px 1fr 370px;height:100vh;overflow:hidden}
#app.lp-off{grid-template-columns:86px 0 1fr 370px}
/* 상단 */
.top{grid-column:1/-1;display:flex;align-items:center;gap:22px;padding:0 20px;background:#fff;border-bottom:1px solid var(--line);z-index:5}
.logo{display:flex;align-items:center;gap:10px;min-width:280px}
.logo svg{flex:none}
.brand{display:flex;flex-direction:column;line-height:1.2}
.brand b{font-size:19px;font-weight:800;color:var(--navy);letter-spacing:-.3px;white-space:nowrap}
.brand small{font-size:11px;color:var(--muted)}
.nav{display:flex;gap:0;flex:1;justify-content:center}
.nav button{border:0;background:none;font-weight:700;font-size:15px;padding:8px 22px;cursor:pointer;color:var(--text);position:relative}
.nav button+button::before{content:'/';position:absolute;left:-4px;color:#cfdcd6;font-weight:400}
.nav button:hover{color:var(--acc)}
.tright{display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:#fff;border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer;white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.chip.ok i{background:var(--acc)}.chip.warn i{background:var(--amber)}
.sel{border:1px solid var(--line2);border-radius:8px;background:#fff;padding:5px 8px;font-size:12px}
/* 진행 막대 */
#stepper{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 20px;background:linear-gradient(90deg,#f2f8f5,#eef3f9);border-bottom:1px solid var(--line)}
#stepper .ttl{font-weight:700;white-space:nowrap;min-width:190px;font-size:12.5px}
#stepper .ttl span{color:var(--muted);font-weight:500}
.big{flex:0 0 200px;display:flex;align-items:center;gap:8px}
.bar{height:8px;background:#dfe7e3;border-radius:99px;overflow:hidden;flex:1;position:relative}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--acc),#3bb37c);border-radius:99px;transition:width .25s}
.bar.run>i{background:repeating-linear-gradient(45deg,var(--acc) 0 10px,#3bb37c 10px 20px);background-size:28px 28px;animation:mv 1s linear infinite}
@keyframes mv{to{background-position:28px 0}}
.pct{font:600 12px var(--mono);min-width:42px;text-align:right}
.steps{display:flex;gap:10px;flex:1}
.stp{flex:1;min-width:0}
.stp .l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:3px;white-space:nowrap;overflow:hidden}
.stp .l b{color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.stp .bar{height:6px}
#task{flex:0 0 250px;font-size:11.5px;color:var(--muted)}
#task .bar{height:5px;margin-top:3px}
/* 왼쪽 */
#rail{grid-row:3;grid-column:1;background:#fff;border-right:1px solid var(--line);overflow-y:auto;overflow-x:hidden}
.ri{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 9px;cursor:pointer;border-bottom:1px solid var(--line);position:relative;text-align:center}
.ri svg{width:24px;height:24px;stroke:var(--navy);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ri span{font-size:11px;line-height:1.25;color:var(--text);word-break:keep-all}
.ri:hover{background:var(--panel2)}
.ri.on{background:linear-gradient(160deg,#1f9a63,#24365f);}
.ri.on svg{stroke:#fff}.ri.on span{color:#fff;font-weight:600}
.ri b{position:absolute;top:6px;right:8px;min-width:16px;height:16px;border-radius:8px;background:var(--acc);color:#fff;font-size:10px;line-height:16px;padding:0 4px}
.ri.on b{background:#fff;color:var(--acc)}
#lpanel{grid-row:3;grid-column:2;background:#fff;border-right:1px solid var(--line);overflow:auto;position:relative}
#app.lp-off #lpanel{display:none}
.ph{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.ph h3{margin:0 0 4px;font-size:16px}
.ph p{margin:0;color:var(--muted);font-size:12px}
.ph .src{margin-top:6px;font-size:11px;color:var(--dim)}
.drop{margin:12px 16px;border:1.5px dashed var(--line2);border-radius:10px;padding:14px;text-align:center;color:var(--muted);font-size:12px;cursor:pointer;background:var(--panel2)}
.drop:hover,.drop.over{border-color:var(--acc);color:var(--acc);background:#eaf6f0}
.drop b{display:block;color:var(--text);font-size:13px;margin-bottom:2px}
.lyr{margin:0 12px 8px;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff}
.lyr .h{display:flex;align-items:center;gap:7px}
.lyr .h b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.lyr .sw{width:14px;height:14px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.15);cursor:pointer;padding:0}
.lyr .m{font:11px var(--mono);color:var(--muted);margin:3px 0 6px 22px}
.lyr .r{display:flex;gap:6px;align-items:center;margin-left:22px;font-size:11.5px;color:var(--muted)}
.lyr .r select{flex:1;min-width:0}
.lyr input[type=range]{flex:1}
.ib{border:0;background:none;cursor:pointer;color:var(--muted);padding:2px 4px;border-radius:5px;font-size:14px;line-height:1}
.ib:hover{background:var(--panel2);color:var(--text)}
.bm{margin:0 12px 10px}
.bm label{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:5px;cursor:pointer;font-size:12.5px}
.bm label:hover{border-color:var(--acc)}
.bm label.on{border-color:var(--acc);background:#eaf6f0;font-weight:600}
.bm .g{font-size:11px;color:var(--muted);margin:10px 2px 5px;font-weight:600}
.empty{padding:6px 16px 14px;color:var(--dim);font-size:12px}
#lpToggle{position:absolute;left:0;top:50%;transform:translateY(-50%);z-index:4;width:22px;height:56px;border:1px solid var(--line);border-left:0;background:#fff;border-radius:0 8px 8px 0;cursor:pointer;color:var(--muted)}
/* 지도 */
#mapwrap{grid-row:3;grid-column:3;position:relative;min-width:0}
#map{position:absolute;inset:0;background:#e8eeea}
.srch{position:absolute;left:36px;top:18px;z-index:3;display:flex;background:#fff;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.14);width:340px}
.srch input{flex:1;border:0;padding:12px 16px;border-radius:10px;outline:none;font-size:14px;background:transparent}
.srch button{border:0;background:none;padding:0 14px;cursor:pointer}
#srchRes{position:absolute;left:36px;top:66px;z-index:3;background:#fff;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.14);width:340px;max-height:320px;overflow:auto}
#srchRes div{padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer}
#srchRes div:hover{background:var(--panel2)}
#srchRes small{display:block;color:var(--muted);font-size:11px}
.ol-zoom{left:auto!important;right:14px;top:14px!important}
.ol-scale-line{left:14px;bottom:12px}
.ol-attribution{font-size:10px}
#attr{position:absolute;right:10px;bottom:8px;z-index:2;font-size:10.5px;background:rgba(255,255,255,.85);padding:2px 8px;border-radius:5px;color:var(--muted)}
.pop{position:absolute;background:#fff;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.2);padding:10px 12px;min-width:220px;max-width:340px;font-size:12px;transform:translate(-50%,calc(-100% - 14px))}
.pop table{border-collapse:collapse;width:100%}.pop td{padding:2px 4px;border-bottom:1px solid var(--line);vertical-align:top}.pop td:first-child{color:var(--muted);white-space:nowrap}
.pop h4{margin:0 0 6px;font-size:13px}
/* 오른쪽 */
#rpanel{grid-row:3;grid-column:4;background:#fff;border-left:1px solid var(--line);overflow:auto}
.rh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.rh h3{margin:0;font-size:16px}
.oc{margin:0 12px 8px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:#fff}
.oc:hover{border-color:var(--acc)}
.oc.on{border-color:var(--acc);box-shadow:0 0 0 2px rgba(31,138,91,.15);background:#f6fbf8}
.oc .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.oc .t b{font-size:13px}
.oc .t span{font:600 11.5px var(--mono);color:var(--acc)}
.oc .bar{height:6px;margin:6px 0 4px}
.oc .s{font-size:11px;color:var(--muted)}
.det{border-top:1px solid var(--line);margin-top:6px;padding:12px 16px 20px}
.det h4{margin:0 0 4px;font-size:15px}
.det .d{color:var(--muted);font-size:12px;margin-bottom:8px}
.f{display:block;font-size:11.5px;color:var(--muted);margin:10px 0 4px;font-weight:600}
.f+select,.f+.sel{width:100%}
.need{display:flex;flex-wrap:wrap;gap:5px}
.need span{font-size:11px;border-radius:99px;padding:2px 9px;border:1px solid var(--line2);cursor:pointer}
.need span.y{background:#e7f5ee;border-color:#9fd3b9;color:var(--acc-d)}
.need span.n{background:#fff4e6;border-color:#f0c88f;color:#9a5d08}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:12.5px}
.btn:hover{border-color:var(--acc)}

.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:6px;align-items:center}
.legend{margin-top:10px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.legend table{width:100%;border-collapse:collapse;font-size:11.5px}
.legend th{background:var(--panel2);text-align:left;padding:5px 7px;font-weight:600;color:var(--muted)}
.legend td{padding:4px 7px;border-top:1px solid var(--line)}
.legend td.n{text-align:right;font-family:var(--mono)}

.dl{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.dl .btn{padding:8px 4px;text-align:center}
.dl .btn b{display:block;font-size:13px}
.dl .btn small{color:var(--muted);font-size:10.5px}
.note{background:#f6f8f7;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11.5px;color:var(--muted);margin-top:8px}
#app.lp-wide{grid-template-columns:86px 560px 1fr 370px}
.ri.guide{background:#f3f6fb}.ri.guide.on{background:linear-gradient(160deg,#2f6fd6,#24365f)}
.gd section{padding:12px 18px;border-bottom:1px solid var(--line)}
.gd h4{margin:0 0 6px;font-size:14.5px;color:var(--navy)}
.gd p,.gd li{font-size:12.5px;line-height:1.75;margin:4px 0}
.gd ol,.gd ul{padding-left:18px;margin:4px 0}
.gd blockquote{margin:8px 0;padding:10px 12px;background:#f2f8f5;border-left:4px solid var(--acc);border-radius:6px;font-size:13px;line-height:1.7}
.gd cite{display:block;font-size:11px;color:var(--muted);font-style:normal;margin-top:4px}
.gd .dim{color:var(--muted);font-size:11.5px}
.gd .lk a{display:block;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;color:var(--blue);text-decoration:none;font-size:12.5px}
.gd .lk a:hover{border-color:var(--blue);background:#f3f7ff}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 12px 10px}
.pk{border:1.5px solid var(--line2);background:#fff;border-radius:9px;padding:9px 8px;cursor:pointer;font-weight:600;font-size:12.5px;position:relative;text-align:center;word-break:keep-all}
.pk:hover{border-color:var(--acc)}
.pk.on{border-color:var(--acc);background:var(--acc);color:#fff;box-shadow:0 2px 8px rgba(31,138,91,.25)}
.pk i{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--acc)}.pk.on i{background:#fff}
.crit{border:1px solid var(--line);border-radius:8px;max-height:230px;overflow:auto}
.ci{display:flex;gap:7px;align-items:flex-start;padding:7px 9px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12px}
.ci:last-child{border-bottom:0}.ci input{margin-top:3px}
.ci b{display:block;font-size:12.5px}.ci em{font-style:normal;font-size:10.5px;color:var(--acc-d);background:#e7f5ee;border-radius:99px;padding:0 6px}
.ci small{display:block;color:var(--muted);font-size:11px;line-height:1.45;margin-top:2px}
.ci.off{opacity:.5}
.cbl{display:flex;gap:6px;align-items:center;font-size:12px;margin:8px 0 2px;cursor:pointer}
.cc{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#fff}
.cc.off{opacity:.55}
.cc textarea{margin:6px 0;resize:vertical;font-size:12.5px;line-height:1.5}
.cp{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-end}
.cp label{display:flex;flex-direction:column;font-size:11px;color:var(--muted);gap:2px}
.cp .cbl{flex-direction:row;color:var(--text)}
.cc .hint{font-size:11px;color:var(--dim);margin-top:6px}

#status{grid-column:1/-1;display:flex;gap:18px;align-items:center;padding:0 14px;background:#fff;border-top:1px solid var(--line);font:11px var(--mono);color:var(--muted)}
#status .sp{flex:1}
/* 모달·토스트 */
#modal{position:fixed;inset:0;background:rgba(20,30,25,.38);z-index:50;display:flex;align-items:center;justify-content:center}
#modal .box{background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:20px 22px;max-width:min(1100px,94vw);max-height:90vh;overflow:auto;min-width:420px}
#modal h3{margin:0 0 10px;font-size:17px}
.inp{border:1px solid var(--line2);border-radius:7px;padding:6px 8px;background:#fff;width:100%}
.mono{font-family:var(--mono)}
.rt{width:100%;border-collapse:collapse;font-size:12px}

.rt input.inp{padding:4px 6px}
.rt td.c input{width:34px;height:28px;padding:0;border:1px solid var(--line2);border-radius:5px}
.rt .err{color:var(--red);font-size:11px}
.vars{font-size:11.5px;color:var(--muted);line-height:1.7;background:var(--panel2);border-radius:8px;padding:8px 10px;margin-bottom:10px}
.vars code{font-family:var(--mono);background:#fff;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--text)}
#toasts{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center}

function hashColor(s) { let h = 0; s = String(s); for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; const hue = Math.abs(h) % 360; return `hsl(${hue},${55 + Math.abs(h >> 8) % 25}%,${52 + Math.abs(h >> 16) % 16}%)`; }

}

}

async function addFiles(cid, fileList) {
  const files = [...fileList];
  const tifs = files.filter((f) => /\.tiff?$/i.test(f.name));
  if (tifs.length && !(CAT[cid].raster || CAT[cid].vecRaster)) { toast('GeoTIFF 영상은 “위성·항공영상” 또는 “과거지도” 탭에 올릴 것', 'warn'); return; }
  for (const f of tifs) await addRaster(f, null, cid);
  const groups = new Map();
  for (const f of files) {
    if (/\.tiff?$/i.test(f.name)) continue;
    if (/\.(zip|geojson|json)$/i.test(f.name)) { groups.set(f.name, [f]); continue; }
    if (/\.(shp|dbf|prj|cpg|shx)$/i.test(f.name)) { const b = f.name.replace(/\.[^.]+$/, ''); if (!groups.has(b)) groups.set(b, []); groups.get(b).push(f); }
  }
  if (!groups.size && !tifs.length) return toast('SHP(.shp·.dbf·.prj 묶음 또는 ZIP), GeoJSON, GeoTIFF만 올릴 수 있음', 'warn');
  if (cid === 'img' && groups.size) { toast('벡터 자료는 해당 주제 탭에 올릴 것 — 지금 탭은 영상 전용', 'warn'); return; }
  for (const [name, fs] of groups) {
    if (!fs.some((f) => /\.(shp|zip|geojson|json)$/i.test(f.name))) { toast(name + ': .shp 파일이 빠짐', 'warn'); continue; }
    const buf = {}; let size = 0;
    for (const f of fs) { buf[f.name] = await f.arrayBuffer(); size += f.size; }
    await loadVector({ cat: cid, name: name.replace(/\.(zip|geojson|json)$/i, ''), files: buf, size, order: Date.now() + S.seq++ });
  }
}

async function loadVector(meta, fromDb) {
  const id = meta.id || 'L' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  meta.id = id; meta.kind = 'vector';
  const label = `${CAT[meta.cat].name} · ${meta.name}`;
  setTask(label + ' 읽는 중', 1);
  try {
    if (!fromDb) await DB.put(meta).catch((e) => toast('브라우저 저장 실패(새로고침하면 다시 올려야 함): ' + e.message, 'warn'));
    const onP = (p, t) => setTask(`${meta.name} — ${t}`, p * 0.85);
    let r = await wjob({ type: 'load', id, files: meta.files, crs: meta.crs, encoding: meta.encoding }, onP);
    if (r.type === 'needcrs') {
      const crs = await askCRS(meta.name); if (!crs) { await DB.del(id); clearTask('취소됨'); return; }
      meta.crs = crs; if (!fromDb) await DB.put(meta);
      r = await wjob({ type: 'load', id, files: meta.files, crs, encoding: meta.encoding }, onP);
    }
    const lm = LS.get('gb2.lm.' + id, {});
    const L = {
      id, cat: meta.cat, name: lm.name || meta.name, kind: 'vector', geom: r.geom, n: r.n, fields: r.fields, cols: r.cols, srcCrs: r.srcCrs, extent: r.extent, size: meta.size, order: meta.order || 0,
      color: lm.color || DEF_COLORS[S.layers.length % DEF_COLORS.length], styleBy: lm.styleBy || (meta.cat === 'lc' ? 'value' : 'single'),
      visible: lm.visible !== false, opacity: lm.opacity == null ? 0.85 : lm.opacity
    };
    L.field = lm.field && r.fields.some((f) => f.name === lm.field) ? lm.field : guessField(meta.cat, r.fields);
    L.col = colOf(L);
    setTask(`${meta.name} — 지도에 그리는 중`, 88);
    await buildFeatures(L, r);
    L.ol = new ol.layer.VectorImage({ source: new ol.source.Vector({ features: L.features, wrapX: false }), style: layerStyle(L), opacity: L.opacity, visible: L.visible, imageRatio: 1.3 });
    L.ol._L = L;
    S.layers.push(L); S.layers.sort((a, b) => a.order - b.order);
    syncVecGroup();
    if (!fromDb) { view.fit(L.extent, { padding: [40, 40, 40, 40], maxZoom: 18, duration: 300 }); toast(`${meta.name}: ${fmt(L.n)}개 도형 불러옴`); }
    clearTask(`${meta.name} 불러옴 (${fmt(L.n)}개)`);
    renderAll();
    return L;
  } catch (e) {
    console.error(e); clearTask('불러오기 실패'); toast(`${meta.name} 불러오기 실패: ${e.message}`, 'err');
    if (!fromDb) DB.del(id).catch(() => { });
  }
}
function colOf(L) { const i = L.fields.findIndex((f) => f.name === L.field); return i >= 0 ? L.cols[i] : null; }
async function buildFeatures(L, r) {
  const c = r.coords, rs = r.ringStart, fr = r.featRing, outer = r.outer, n = r.n, feats = new Array(n);
  for (let f = 0; f < n; f++) {
    const r0 = fr[f], r1 = fr[f + 1]; let g = null;
    if (r1 > r0) {
      const p0 = rs[r0], p1 = rs[r1], flat = Array.prototype.slice.call(c.subarray(2 * p0, 2 * p1));
      if (L.geom === 'poly') {
        const endss = []; let cur = null;
        for (let k = r0; k < r1; k++) { const end = 2 * (rs[k + 1] - p0); if (outer[k] || !cur) { cur = [end]; endss.push(cur); } else cur.push(end); }
        g = new ol.geom.MultiPolygon(flat, 'XY', endss);
      } else if (L.geom === 'line') {
        const ends = []; for (let k = r0; k < r1; k++) ends.push(2 * (rs[k + 1] - p0));
        g = new ol.geom.MultiLineString(flat, 'XY', ends);

    const ft = new ol.Feature(g); ft._i = f; ft._L = L; feats[f] = ft;
    if ((f & 16383) === 16383) { setTask(`${L.name} — 지도에 그리는 중`, 88 + 10 * f / n); await tick(); }
  }
  L.features = feats;
}
function syncVecGroup() {
  const arr = S.layers.filter((l) => l.kind === 'vector').map((l) => l.ol);
  vecGroup.getLayers().clear(); arr.forEach((l) => vecGroup.getLayers().push(l));
  const rs = S.layers.filter((l) => l.kind === 'raster').map((l) => l.ol);
  rasterGroup.getLayers().clear(); rs.forEach((l) => rasterGroup.getLayers().push(l));
}

  worker.postMessage({ type: 'drop', id: L.id }); await DB.del(L.id).catch(() => { }); localStorage.removeItem('gb2.lm.' + L.id);

async function addRaster(file, fromDb, cat) {
  cat = (fromDb && fromDb.cat) || cat || 'img';

  try {
    const blob = fromDb ? fromDb.blob : file;
    const src = new ol.source.GeoTIFF({ sources: [{ blob }], normalize: true });
    const lm = LS.get('gb2.lm.' + id, {});
    const L = { id, cat, kind: 'raster', name: lm.name || (fromDb ? fromDb.name : file.name), size: blob.size, visible: lm.visible !== false, opacity: lm.opacity == null ? 1 : lm.opacity, order: fromDb ? fromDb.order : Date.now() };

function loadOutputs() {
  const saved = LS.get('gb2.outputs', null);
  const defs = JSON.parse(JSON.stringify(OUT_DEFAULTS)).map((o) => ({ ...o, builtin: true, criteria: JSON.parse(JSON.stringify(CRIT_DEFAULTS[o.id] || [])) }));
  if (!saved) return defs;
  const byId = Object.fromEntries(saved.map((o) => [o.id, o]));
  const out = defs.map((d) => (byId[d.id] ? { ...d, ...byId[d.id], builtin: true } : d));
  saved.filter((o) => !OUT_DEFAULTS.some((d) => d.id === o.id)).forEach((o) => out.push(o));
  out.forEach((o) => { if (!Array.isArray(o.criteria)) o.criteria = JSON.parse(JSON.stringify(CRIT_DEFAULTS[o.id] || [])); });
  if (LS.get('gb2.critver', 1) < 2) { // 2판: “산지 도로를 산림에 합치기” 예시를 “영상에서 임도 따기”로 바꿈
    const b = out.find((o) => o.id === 'biotope'); if (b) { b.criteria = JSON.parse(JSON.stringify(CRIT_DEFAULTS.biotope)); if (!b.rules.some((r) => r.code === 'B12')) { const i = b.rules.findIndex((r) => r.code === 'B11'); b.rules.splice(i + 1, 0, { code: 'B12', name: '임도', color: '#cfa77a', when: 'false' }); } if (!b.rules.some((r) => r.code === '{과거}')) { const z = b.rules.findIndex((r) => r.when === 'true'); b.rules.splice(z < 0 ? b.rules.length : z, 0, { code: '{과거}', name: '{과거}', color: 'auto', when: "과거 != null && 과거_비율 >= 0.5" }); } }
    LS.set('gb2.critver', 2); LS.set('gb2.outputs', out.map(({ run, exported, ...o }) => o));
  }
  return out;
}
function saveOutputs() { LS.set('gb2.outputs', S.outputs.map(({ run, exported, ...o }) => o)); }
S.outputs = loadOutputs();
const curOut = () => S.outputs.find((o) => o.id === S.outId) || S.outputs[0];
function keysIn(o) {
  const txt = o.rules.map((r) => r.when + ' ' + r.code + ' ' + r.name).join(' ');
  return DATA_CATS.filter((c) => !c.raster && new RegExp('(^|[^가-힣A-Za-z0-9_])' + c.key + '(?![가-힣A-Za-z0-9])').test(txt)).map((c) => c.key);
}
function hasKey(k) { return S.layers.some((l) => l.kind === 'vector' && CAT[l.cat].key === k); }
function baseCandidates() { return S.layers.filter((l) => l.kind === 'vector' && l.geom === 'poly'); }
function defaultBase(o) {
  for (const k of o.basePref || []) { const L = S.layers.find((l) => l.kind === 'vector' && l.geom === 'poly' && CAT[l.cat].key === k); if (L) return L.id; }
  const c = baseCandidates(); return c[0] ? c[0].id : '';
}
function progressOf(o) {
  const need = keysIn(o), core = (o.basePref || []).filter((k) => need.includes(k) || true);
  const coreOk = core.some(hasKey), others = need.filter((k) => !core.includes(k));
  const s1 = Math.round((coreOk ? 60 : 0) + (others.length ? 40 * others.filter(hasKey).length / others.length : (coreOk ? 40 : 0)));
  const baseId = o.base && layerById(o.base) ? o.base : defaultBase(o);
  const s2 = baseId ? 100 : 0;
  const res = S.results[o.id];
  const s3 = o.run && o.run.state === 'run' ? o.run.pct : res ? 100 : 0;
  const s4 = o.exported && o.exported.size ? 100 : 0;
  return { need, s1, s2, s3, s4, all: Math.round(0.2 * s1 + 0.15 * s2 + 0.5 * s3 + 0.15 * s4), baseId, stale: res && res.rulesSig !== rulesSig(o) };
}

    nb++; setTask(`${c.title} — 영상 판독 블록 ${nb}/${blocks.size} (타일 ${fmt(fetched)}/${fmt(tiles.size)})`, 100 * done / tiles.size * 0.95);
    const b = $('#oRun'); if (b) b.textContent = `영상 판독 중 ${Math.round(100 * done / tiles.size)}%`;

    const ox = tx0 * tm - WM, oy = WM - ty0 * tm; // 블록 왼쪽 위(3857)
    const need = []; for (let ty = ty0; ty < ty0 + NT; ty++) for (let tx = tx0; tx < tx0 + NT; tx++) if (tiles.has(tx + ',' + ty)) need.push([tx, ty]);
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const g = cv.getContext('2d', { willReadFrequently: true });
    const imgs = []; for (let i = 0; i < need.length; i += 12) imgs.push(...(await Promise.all(need.slice(i, i + 12).map(([tx, ty]) => loadTile(roadTileURL(z, tx, ty))))));

}
// 픽셀 판독: 대상(산림) 안에서 주변보다 밝고 녹색이 약한 화소 → 너무 넓은 덩어리 제거 → 길쭉한 덩어리만
function roadPixels(px, md, W, H, q) {
  const N = W * H, M = new Uint8Array(N), Lm = new Uint8Array(N), hist = new Uint32Array(256);
  let cnt = 0;
  for (let i = 0, j = 0; i < N; i++, j += 4) { if (md[j + 3] < 128 || px[j + 3] < 128) continue; M[i] = 1; const l = (px[j] * 77 + px[j + 1] * 150 + px[j + 2] * 29) >> 8; Lm[i] = l; hist[l]++; cnt++; }

  const med = (h, n) => { let s = 0; for (let k = 0; k < 256; k++) { s += h[k]; if (s >= n / 2) return k; } return 255; };
  const m = med(hist, cnt), hd = new Uint32Array(256); for (let i = 0; i < N; i++) if (M[i]) hd[Math.min(255, Math.abs(Lm[i] - m))]++;
  const sd = Math.max(4, 1.4826 * med(hd, cnt)), thr = Math.max(m + q.sens * sd, m + 18);
  let C = new Uint8Array(N);
  for (let i = 0, j = 0; i < N; i++, j += 4) if (M[i] && Lm[i] > thr && 2 * px[j + 1] - px[j] - px[j + 2] <= 12) C[i] = 1;
  // 닫힘(3×3 팽창 → 침식)으로 작은 틈 메우기
  const dil = new Uint8Array(N), ero = new Uint8Array(N);
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) { const i = y * W + x; if (C[i] || C[i - 1] || C[i + 1] || C[i - W] || C[i + W] || C[i - W - 1] || C[i - W + 1] || C[i + W - 1] || C[i + W + 1]) dil[i] = 1; }
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) { const i = y * W + x; if (dil[i] && dil[i - 1] && dil[i + 1] && dil[i - W] && dil[i + W] && dil[i - W - 1] && dil[i - W + 1] && dil[i + W - 1] && dil[i + W + 1] && M[i]) ero[i] = 1; }
  C = ero;
  // 거리변환(3-4 chamfer)으로 폭이 hw보다 넓은 덩어리 부분 제거
  const cham = (src, inside) => { const D = new Float32Array(N); const INF = 1e9; for (let i = 0; i < N; i++) D[i] = (src[i] ? inside : !inside) ? INF : 0;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const i = y * W + x; if (!D[i]) continue; let v = D[i]; if (x > 0) v = Math.min(v, D[i - 1] + 3); if (y > 0) { v = Math.min(v, D[i - W] + 3); if (x > 0) v = Math.min(v, D[i - W - 1] + 4); if (x < W - 1) v = Math.min(v, D[i - W + 1] + 4); } D[i] = v; }
    for (let y = H - 1; y >= 0; y--) for (let x = W - 1; x >= 0; x--) { const i = y * W + x; if (!D[i]) continue; let v = D[i]; if (x < W - 1) v = Math.min(v, D[i + 1] + 3); if (y < H - 1) { v = Math.min(v, D[i + W] + 3); if (x < W - 1) v = Math.min(v, D[i + W + 1] + 4); if (x > 0) v = Math.min(v, D[i + W - 1] + 4); } D[i] = v; }
    return D; };
  const D1 = cham(C, true), core = new Uint8Array(N); let anyCore = false;
  for (let i = 0; i < N; i++) if (D1[i] / 3 > q.hw) { core[i] = 1; anyCore = true; }
  if (anyCore) { const D2 = cham(core, false); for (let i = 0; i < N; i++) if (C[i] && D2[i] / 3 <= q.hw + 1) C[i] = 0; }
  // 8방향 연결 덩어리 → 길이·면적 거르기
  const lab = new Int32Array(N), stack = new Int32Array(N), out = [];
  let nl = 0;
  for (let s0 = 0; s0 < N; s0++) {
    if (!C[s0] || lab[s0]) continue;
    nl++; let sp = 0, A = 0, P = 0; stack[sp++] = s0; lab[s0] = nl; const pix = [];
    while (sp) {

      if (x === 0 || !C[i - 1]) P++; if (x === W - 1 || !C[i + 1]) P++; if (y === 0 || !C[i - W]) P++; if (y === H - 1 || !C[i + W]) P++;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { if (!dx && !dy) continue; const xx = x + dx, yy = y + dy; if (xx < 0 || yy < 0 || xx >= W || yy >= H) continue; const k = yy * W + xx; if (C[k] && !lab[k]) { lab[k] = nl; stack[sp++] = k; } }

}

    const chk = r.meta ? r.meta.chk : null; let chkN = 0; if (chk) for (let f = 0; f < r.n; f++) if (chk[f] && r.code[f] !== -2) chkN++;

function vwSearch(q, type, category) {
  return new Promise((res, rej) => {
    const cb = 'vwcb' + Date.now() + Math.floor(Math.random() * 1e4), s = document.createElement('script');
    const tm = setTimeout(() => { cleanup(); rej(new Error('응답 없음')); }, 10000);
    const cleanup = () => { clearTimeout(tm); delete window[cb]; s.remove(); };
    window[cb] = (d) => { cleanup(); res(d); };
    s.src = `https://api.vworld.kr/req/search?service=search&request=search&version=2.0&crs=EPSG:4326&size=10&page=1&query=${encodeURIComponent(q)}&type=${type}${category ? '&category=' + category : ''}&format=json&errorformat=json&key=${encodeURIComponent(vwKey())}&domain=${encodeURIComponent(location.origin)}&callback=${cb}`;
    s.onerror = () => { cleanup(); rej(new Error('검색 서버 연결 실패')); };
    document.head.appendChild(s);
  });
}

async function restore() {
  let saved = [];

  saved.sort((a, b) => (a.order || 0) - (b.order || 0));
  for (let i = 0; i < saved.length; i++) {
    const m = saved[i];
    setTask(`저장된 자료 불러오는 중 ${i + 1}/${saved.length}`, 100 * i / saved.length);
    if (m.kind === 'raster') await addRaster(null, m); else await loadVector(m, true);

}

  async function callClaude(signal, onText) {

      method: 'POST', signal,
      headers: { 'content-type': 'application/json', 'x-api-key': GB.aiKey(), 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },

    });

      if (ev.type === 'content_block_start') {
        const cb = ev.content_block;
        blocks[ev.index] = cb.type === 'text' ? { type: 'text', text: '' } : cb.type === 'tool_use' ? { type: 'tool_use', id: cb.id, name: cb.name, input: {}, _j: '' } : cb;
      } else if (ev.type === 'content_block_delta') {
        const b = blocks[ev.index], d = ev.delta;
        if (d.type === 'text_delta') { b.text += d.text; onText(blocks.filter((x) => x && x.type === 'text').map((x) => x.text).join('')); }
        else if (d.type === 'input_json_delta') b._j += d.partial_json;
      } else if (ev.type === 'content_block_stop') {
        const b = blocks[ev.index];
        if (b && b.type === 'tool_use') { try { b.input = b._j ? JSON.parse(b._j) : {}; } catch (e) { b.input = {}; } delete b._j; }

  }

      body.innerHTML = `<div style="padding:14px;overflow:auto">
        <p class="hint">사이트 안에서 Claude에게 “상단 메뉴 색 바꿔줘”, “이 버튼 이름 바꿔줘”, “이런 기능 추가해줘”처럼 말로 요청하면 Claude가 직접 화면·기능을 고침. 고친 내용은 아래 ‘임시 저장’ 또는 ‘사이트에 게시’로 확정함.</p>
        <div class="box"><label style="margin-top:0">Anthropic API 키 ${GB.aiKey() ? '<span class="ok">· 저장됨</span>' : ''}</label><input type="password" id="aiKey" placeholder="${GB.aiKey() ? '바꿀 때만 입력' : 'sk-ant-…'}">
        <label>모델</label><input type="text" id="aiModel" value="${h(GB.aiModel())}">
        <p class="hint" style="margin-top:8px">claude.ai 구독과는 별개로, Anthropic Console(console.anthropic.com)에서 발급한 API 키가 필요함. 사용량만큼 키 소유자에게 요금이 청구됨. 키는 이 브라우저(localStorage)에만 저장되고 사이트 파일에는 들어가지 않음. 공용 PC에서는 저장하지 말 것.</p>
        <div class="row"><button class="b pri" id="aiKeySave">${GB.aiKey() ? '저장' : '저장하고 시작'}</button>${GB.aiKey() ? '<button class="b" id="aiKeyCancel">취소</button><span style="flex:1"></span><button class="b warn" id="aiKeyDel">키 삭제</button>' : ''}</div></div></div>`;
      const kc = $e('#aiKeyCancel'); if (kc) kc.onclick = () => { AIC.keyForm = false; render(); };
      const kd = $e('#aiKeyDel'); if (kd) kd.onclick = () => { LS.set('gb-anthropic-key', ''); AIC.keyForm = false; syncAppAi(); render(); };
      $e('#aiKeySave').onclick = () => {
        const k = $e('#aiKey').value.trim(); if (!k && !GB.aiKey()) return say('API 키를 입력할 것', 'warn');
        if (k) LS.set('gb-anthropic-key', k); LS.set('gb-anthropic-model', $e('#aiModel').value.trim());
        AIC.keyForm = false; syncAppAi(); render();
      };
      return;
    }
    body.innerHTML = `<div class="ai-hd"><span>모델 <span class="mono">${h(GB.aiModel())}</span></span><span style="flex:1"></span>${srcDirty ? '<button class="b" id="aiPrev" title="Claude가 고친 index.html 원본을 새 창에서 확인">소스 미리보기</button>' : ''}<button class="b" id="aiNew">새 대화</button><button class="b" id="aiKeyBtn">키 설정</button></div>
      <div class="ai-log" id="aiLog"></div>
      <div class="ai-in"><div class="ai-imgs" id="aiImgs"></div><textarea id="aiIn" placeholder="무엇을 바꿀지 말하기 (Enter 보내기 · Shift+Enter 줄바꿈 · 화면 캡처 붙여넣기 가능)">${h(AIC.draft)}</textarea>
      <div class="row" style="margin-top:6px"><button class="b" id="aiAttach" title="이미지 첨부">이미지</button><span style="flex:1" class="mono" id="aiCost"></span><button class="b warn" id="aiStop" ${AIC.busy ? '' : 'style="display:none"'}>중지</button><button class="b pri" id="aiGo" ${AIC.busy ? 'disabled' : ''}>보내기</button></div></div>`;
    const ta = $e('#aiIn');
    ta.oninput = () => { AIC.draft = ta.value; };
    ta.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); aiSend(ta.value); } };
    ta.onpaste = (e) => { const f = [...(e.clipboardData && e.clipboardData.files || [])].filter((x) => /^image\//.test(x.type)); if (f.length) { e.preventDefault(); f.forEach(addImg); } };
    $e('#aiGo').onclick = () => aiSend(ta.value);
    $e('#aiStop').onclick = () => { if (AIC.ctl) AIC.ctl.abort(); };
    $e('#aiAttach').onclick = () => { const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/png,image/jpeg,image/webp,image/gif'; i.multiple = true; i.onchange = () => [...i.files].forEach(addImg); i.click(); };
    $e('#aiNew').onclick = () => { if (AIC.busy) return; AIC.msgs = []; AIC.ui = []; drawAi(); };
    $e('#aiKeyBtn').onclick = () => { if (AIC.busy) return; AIC.keyForm = true; render(); };
    const pv = $e('#aiPrev'); if (pv) pv.onclick = () => preview(srcText);
    drawImgs(); drawLog();
    setTimeout(() => ta.focus(), 0);
  }
  function syncAppAi() {
    try { if (S.local && S.local.web) { S.local.ai = !!GB.aiKey(); if (AI.mode !== 'claude') AI.mode = S.local.ai ? 'local' : null; renderAIChip(); } } catch (e) { }
  }
  function addImg(file) {
    if (file.size > 4.5 * 1024 * 1024) return say('이미지는 4.5MB 이하만 가능', 'warn');
    if (AIC.imgs.length >= 5) return say('이미지는 한 번에 5장까지', 'warn');
    const fr = new FileReader(); fr.onload = () => { AIC.imgs.push(fr.result); drawImgs(); }; fr.readAsDataURL(file);
  }
  function drawImgs() {
    const box = $e('#aiImgs'); if (!box) return;
    box.innerHTML = AIC.imgs.map((d, i) => `<span><img src="${d}"><button data-i="${i}">×</button></span>`).join('');
    box.querySelectorAll('button').forEach((b) => b.onclick = () => { AIC.imgs.splice(+b.dataset.i, 1); drawImgs(); });
  }
  let rafLog = 0;
  function drawLogSoon() { if (!rafLog) rafLog = requestAnimationFrame(() => { rafLog = 0; drawLog(); }); }
  function drawLog() {
    const log = $e('#aiLog'); if (!log) return;
    const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
    if (!AIC.ui.length) {
      log.innerHTML = `<div class="ai-a">무엇을 바꿀지 말하면 바로 고침. 예:</div><div class="ai-sg">${SUGGEST.map((s) => `<button class="b" data-s="${h(s)}">${h(s)}</button>`).join('')}</div>
        <p class="hint" style="margin-top:10px">고친 내용은 아직 나만 보는 상태임 — 아래 ‘임시 저장’ 또는 ‘사이트에 게시’로 확정. 화면 캡처를 붙여넣고 “여기를 이렇게”처럼 요청해도 됨.</p>`;
      log.querySelectorAll('[data-s]').forEach((b) => b.onclick = () => aiSend(b.dataset.s));
      return;
    }
    log.innerHTML = AIC.ui.map((m, i) => {
      if (m.role === 'user') return `<div class="ai-u">${(m.imgs || []).map((d) => `<img src="${d}">`).join('')}${h(m.text)}</div>`;
      if (m.role === 'assistant') return `<div class="ai-a">${md(m.text)}${m.live ? '<span class="ai-dot"></span>' : ''}</div>`;
      if (m.role === 'tool') return `<div class="ai-t ${m.ok == null ? '' : m.ok ? 'ok' : 'bad'}" data-t="${i}"><i>${m.ok == null ? '…' : m.ok ? '✓' : '✕'}</i><div style="min-width:0;flex:1">${h(m.label)}${m.detail ? `<pre>${h(clip(m.detail, 4000))}</pre>` : ''}</div></div>`;
      if (m.role === 'undo') return `<div class="row"><button class="b" data-u="${i}" ${m.used ? 'disabled' : ''}>${m.used ? '취소됨' : '↶ 이 요청의 변경 취소'}</button></div>`;
      if (m.role === 'note') return `<div class="ai-n">${h(m.text)}</div>`;
      return `<div class="ai-e">${h(m.text)}</div>`;
    }).join('') + (AIC.busy && !AIC.ui.some((m) => m.live) && !AIC.ui.some((m) => m.role === 'tool' && m.ok == null) ? '<div class="ai-n">생각 중<span class="ai-dot"></span></div>' : '');
    log.querySelectorAll('[data-t]').forEach((d) => d.onclick = () => d.classList.toggle('open'));
    log.querySelectorAll('[data-u]').forEach((b) => b.onclick = () => { if (!AIC.busy) aiUndo(AIC.ui[+b.dataset.u]); });
    if (atBottom || AIC.busy) log.scrollTop = log.scrollHeight;
  }
  function drawAi() {
    if (tab !== 'ai' || root.classList.contains('hide')) return;
    const go = $e('#aiGo'), stp = $e('#aiStop');
    if (!go) return render();
    go.disabled = AIC.busy; stp.style.display = AIC.busy ? '' : 'none';
    const ta = $e('#aiIn'); if (ta && !AIC.busy && ta.value !== AIC.draft) ta.value = AIC.draft;
    const hd = $e('.ai-hd'); if (hd && !!$e('#aiPrev') !== srcDirty) return render();
    drawImgs(); drawLog();
  }
  GB.claude = { send: aiSend, state: AIC };


  fab(); banner();
  if (/[?&]edit\b/.test(location.search) || location.hash === '#edit') setTimeout(() => toggle(true), 400);
})();
</script>
</body>
</html>
